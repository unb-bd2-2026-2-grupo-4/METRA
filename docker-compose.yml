services:
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: g4_docs
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    command: serve --dev-addr=0.0.0.0:8000

  postgres:
    image: postgres:16
    container_name: g4_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metra}
      POSTGRES_USER: ${POSTGRES_USER:-metra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metra}
    command: >
      postgres
      -c max_wal_size=4GB
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingestao-bronze:
    build:
      context: .
      dockerfile: docker/ingestao/Dockerfile
    profiles: ["ingestao"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-metra}
      PGUSER: ${POSTGRES_USER:-metra}
      PGPASSWORD: ${POSTGRES_PASSWORD:-metra}
      METRA_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro

volumes:
  postgres_data:
