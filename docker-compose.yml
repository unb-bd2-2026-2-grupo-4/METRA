services:
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: g4_docs
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    command: serve --dev-addr=0.0.0.0:8000

  postgres:
    image: postgres:16
    container_name: g4_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metra}
      POSTGRES_USER: ${POSTGRES_USER:-metra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metra}
    command: >
      postgres
      -c max_wal_size=4GB
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingestao-bronze:
    build:
      context: .
      dockerfile: docker/ingestao/Dockerfile
    profiles: ["ingestao"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-metra}
      PGUSER: ${POSTGRES_USER:-metra}
      PGPASSWORD: ${POSTGRES_PASSWORD:-metra}
      METRA_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro

  dagster-webserver:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    profiles: ["dagster"]
    container_name: g4_dagster
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-metra}
      PGUSER: ${POSTGRES_USER:-metra}
      PGPASSWORD: ${POSTGRES_PASSWORD:-metra}
      METRA_LAKE_PARQUET: /app/data/lake/parquet
      METRA_DUCKDB: /app/data/metra_analitico.duckdb
    volumes:
      - ./data:/app/data
      - dagster_home:/opt/dagster/dagster_home

  dagster-daemon:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    profiles: ["dagster"]
    container_name: g4_dagster_daemon
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-metra}
      PGUSER: ${POSTGRES_USER:-metra}
      PGPASSWORD: ${POSTGRES_PASSWORD:-metra}
      METRA_LAKE_PARQUET: /app/data/lake/parquet
      METRA_DUCKDB: /app/data/metra_analitico.duckdb
    command: ["dagster-daemon", "run", "-w", "workspace.yaml"]
    volumes:
      - ./data:/app/data
      - dagster_home:/opt/dagster/dagster_home

  # Painel Streamlit (E4): lê a Gold gerada pelo dbt/Dagster, sem escrever no banco.
  #   docker compose --profile painel up --build -d painel
  painel:
    build:
      context: .
      dockerfile: docker/painel/Dockerfile
    profiles: ["painel"]
    container_name: g4_painel
    restart: unless-stopped
    ports:
      - "${PAINEL_PORT:-8501}:8501"
    environment:
      METRA_DUCKDB: /app/data/metra_analitico.duckdb
    volumes:
      # Somente leitura: o painel nunca cria, altera ou apaga o banco analítico.
      - ./data:/app/data:ro
      - ./src:/app/src:ro

volumes:
  postgres_data:
  dagster_home:
