# Camada analítica do METRA (E3): Parquet extraído do OLTP -> Silver -> Gold no DuckDB.
name: metra
version: "1.0.0"
profile: metra

model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

models:
  metra:
    # Silver: limpeza e padronização 1:1 com as tabelas da origem.
    # Materializada como tabela para não depender do caminho do Parquet na leitura.
    staging:
      +schema: silver
      +materialized: table
    # Gold: dimensões e fatos do Star Schema.
    marts:
      +schema: gold
      +materialized: table
    # Consumo: views agregadas com supressão de pequenos grupos, únicas relações
    # publicadas para consumidores externos (ver macros/consumo.sql).
    consumo:
      +schema: consumo
      +materialized: view

vars:
  # Mínimo de movimentações por grupo e de salários válidos por medida salarial.
  metra_limite_publicacao: 5
  # Teto do salário válido (R$). Acima dele o registro é tratado como erro de cadastro:
  # a base completa tem admissões de R$ 1 milhão a R$ 1 trilhão, que distorcem toda média.
  # Lido também por src/metricas/camada_semantica.py (salario_maximo_valido).
  metra_salario_maximo_valido: 150000
