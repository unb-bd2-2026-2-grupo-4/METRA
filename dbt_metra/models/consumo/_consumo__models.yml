version: 2

# Contratos das views públicas. metra_column_types fixa as colunas expostas: uma
# coluna nova (por exemplo, um identificador da movimentação) faz o teste falhar.

models:
  - name: setor_mensal
    description: >
      Fluxos por competência, UF e seção CNAE (P1, P2 e P4). Só grupos com pelo menos
      5 movimentações; medidas salariais nulas com menos de 5 salários válidos.
    data_tests:
      - metra_unique_combination:
          arguments:
            columns: [competencia, sigla_uf, codigo_secao]
      - metra_column_types:
          arguments:
            expected:
              competencia: DATE
              sigla_uf: VARCHAR
              codigo_secao: VARCHAR
              admissoes: HUGEINT
              desligamentos: HUGEINT
              saldo: HUGEINT
              soma_salarios_admissao: DECIMAL(38,2)
              qtd_salarios_admissao: HUGEINT
      - &grupo_publicavel
        metra_expression:
          arguments:
            expression: "admissoes + desligamentos >= {{ var('metra_limite_publicacao') }}"
      - &saldo_consistente
        metra_expression:
          arguments:
            expression: "saldo = admissoes - desligamentos"
      - &salario_suprimido_junto
        metra_expression:
          arguments:
            expression: "(qtd_salarios_admissao is null) = (soma_salarios_admissao is null)"
      - &salario_publicavel
        metra_expression:
          arguments:
            expression: "qtd_salarios_admissao is null or qtd_salarios_admissao >= {{ var('metra_limite_publicacao') }}"
    columns:
      - name: competencia
        description: "Primeiro dia do mês de ocorrência da movimentação (DATE)."
        data_tests: [not_null]
      - name: sigla_uf
        description: "Sigla da Unidade da Federação no Centro-Oeste (DF, GO, MT ou MS)."
        data_tests:
          - accepted_values:
              arguments:
                values: [DF, GO, MT, MS]
      - name: codigo_secao
        description: "Código da seção da CNAE 2.0 (A–U ou Z para não identificada)."
        data_tests: [not_null]
      - name: admissoes
        description: "Total de admissões do grupo (publicado somente quando admissoes + desligamentos >= 5)."
      - name: desligamentos
        description: "Total de desligamentos do grupo (publicado somente quando admissoes + desligamentos >= 5)."
      - name: saldo
        description: "Saldo líquido de vínculos no grupo (admissoes - desligamentos)."
      - name: soma_salarios_admissao
        description: "Soma em R$ nominais dos salários válidos de admissão; NULL quando qtd_salarios_admissao < 5."
      - name: qtd_salarios_admissao
        description: "Denominador de admissões com salário válido; NULL quando menor que 5 observações."

  - name: geografia_mensal
    description: >
      Fluxos por competência, UF e capital/interior (P3), com a mesma supressão.
    data_tests:
      - metra_unique_combination:
          arguments:
            columns: [competencia, sigla_uf, is_capital]
      - metra_column_types:
          arguments:
            expected:
              competencia: DATE
              sigla_uf: VARCHAR
              is_capital: BOOLEAN
              admissoes: HUGEINT
              desligamentos: HUGEINT
              saldo: HUGEINT
              soma_salarios_admissao: DECIMAL(38,2)
              qtd_salarios_admissao: HUGEINT
      - *grupo_publicavel
      - *saldo_consistente
      - *salario_suprimido_junto
      - *salario_publicavel
    columns:
      - name: competencia
        description: "Primeiro dia do mês de ocorrência da movimentação (DATE)."
        data_tests: [not_null]
      - name: sigla_uf
        description: "Sigla da Unidade da Federação no Centro-Oeste (DF, GO, MT ou MS)."
        data_tests:
          - accepted_values:
              arguments:
                values: [DF, GO, MT, MS]
      - name: is_capital
        description: "Verdadeiro para as capitais (Brasília, Goiânia, Cuiabá e Campo Grande); falso para municípios do interior."
        data_tests: [not_null]
      - name: admissoes
        description: "Total de admissões do grupo (publicado somente quando admissoes + desligamentos >= 5)."
      - name: desligamentos
        description: "Total de desligamentos do grupo (publicado somente quando admissoes + desligamentos >= 5)."
      - name: saldo
        description: "Saldo líquido de vínculos no grupo (admissoes - desligamentos)."
      - name: soma_salarios_admissao
        description: "Soma em R$ nominais dos salários válidos de admissão; NULL quando qtd_salarios_admissao < 5."
      - name: qtd_salarios_admissao
        description: "Denominador de admissões com salário válido; NULL quando menor que 5 observações."

  - name: perfil_anual
    description: >
      Fluxos por ano, UF, capital/interior, seção CNAE e categoria de um eixo
      demográfico por vez (P5), com a mesma supressão. Os eixos não se cruzam.
    data_tests:
      - metra_unique_combination:
          arguments:
            columns: [ano, sigla_uf, is_capital, codigo_secao, eixo, codigo_categoria]
      - metra_column_types:
          arguments:
            expected:
              ano: INTEGER
              sigla_uf: VARCHAR
              is_capital: BOOLEAN
              codigo_secao: VARCHAR
              eixo: VARCHAR
              codigo_categoria: INTEGER
              categoria: VARCHAR
              admissoes: HUGEINT
              desligamentos: HUGEINT
              saldo: HUGEINT
              soma_salarios_admissao: DECIMAL(38,2)
              qtd_salarios_admissao: HUGEINT
      - *grupo_publicavel
      - *saldo_consistente
      - *salario_suprimido_junto
      - *salario_publicavel
    columns:
      - name: ano
        description: "Ano de ocorrência das movimentações (INTEGER); os perfis são publicados por ano."
      - name: sigla_uf
        description: "Sigla da Unidade da Federação no Centro-Oeste (DF, GO, MT ou MS)."
      - name: is_capital
        description: "Verdadeiro para capital e falso para interior."
      - name: codigo_secao
        description: "Código da seção da CNAE 2.0 (A–U ou Z)."
      - name: eixo
        description: "Dimensão sociodemográfica avaliada isoladamente (sexo, raca_cor, escolaridade ou faixa_etaria)."
        data_tests:
          - accepted_values:
              arguments:
                values: [sexo, raca_cor, escolaridade, faixa_etaria]
      - name: codigo_categoria
        description: "Código inteiro da categoria demográfica dentro do eixo correspondente."
        data_tests: [not_null]
      - name: categoria
        description: "Rótulo textual da categoria demográfica (ex.: Mulher, Parda, Superior Completo)."
        data_tests: [not_null]
      - name: admissoes
        description: "Total de admissões da categoria (publicado somente quando admissoes + desligamentos >= 5)."
      - name: desligamentos
        description: "Total de desligamentos da categoria (publicado somente quando admissoes + desligamentos >= 5)."
      - name: saldo
        description: "Saldo líquido de vínculos na categoria (admissoes - desligamentos)."
      - name: soma_salarios_admissao
        description: "Soma em R$ nominais dos salários válidos de admissão; NULL quando qtd_salarios_admissao < 5."
      - name: qtd_salarios_admissao
        description: "Denominador de admissões com salário válido; NULL quando menor que 5 observações."

  - name: calendario
    description: >
      Competências contínuas do período; tem_dados indica movimentação na origem,
      independentemente da supressão.
    data_tests:
      - metra_column_types:
          arguments:
            expected:
              competencia: DATE
              tem_dados: BOOLEAN
    columns:
      - name: competencia
        description: "Primeiro dia do mês no intervalo contínuo observado na base (DATE)."
        data_tests: [unique, not_null]
      - name: tem_dados
        description: "Verdadeiro quando a competência possui movimentações registradas na origem Silver."
        data_tests: [not_null]
