version: 2

# Camada Silver: uma linha por registro da origem, com nomes padronizados e colunas derivadas.
# Os testes de qualidade desta camada são definidos à parte (dbt test).

models:
  - name: stg_movimentacao
    description: Movimentações de admissão e desligamento do Novo CAGED, uma linha por movimentação da origem.
    columns:
      - name: id_movimentacao
        description: Chave da movimentação na origem (oltp.movimentacao).
      - name: ano
        description: Ano da competência.
      - name: mes
        description: Mês da competência (1 a 12).
      - name: competencia
        description: Primeiro dia do mês da competência.
      - name: id_municipio
        description: Código IBGE de 7 dígitos; 9999999 quando não identificado. Liga a stg_municipio.
      - name: codigo_cnae_subclasse
        description: Subclasse CNAE 2.0 de 7 dígitos; 9999999 quando não identificada. Liga a stg_cnae.
      - name: codigo_cbo
        description: Ocupação CBO 2002 de 6 dígitos. Liga a stg_cbo.
      - name: codigo_sexo
        description: Código do CAGED (1 homem, 3 mulher, 9 não identificado).
      - name: codigo_raca_cor
        description: Código do CAGED (1 branca, 2 preta, 3 parda, 4 amarela, 5 indígena, 6 não informada, 9 não identificado).
      - name: idade
        description: Idade em anos; nula quando ausente ou fora de 10 a 120.
      - name: codigo_grau_instrucao
        description: Código de escolaridade do CAGED.
      - name: codigo_tipo_movimentacao
        description: Código do tipo de movimentação do CAGED (admissão, demissão, aposentadoria etc.).
      - name: saldo_movimentacao
        description: 1 para admissão e -1 para desligamento; a soma é o saldo de empregos.
      - name: tipo_evento
        description: "'admissao' ou 'desligamento', derivado de saldo_movimentacao."
      - name: salario_mensal
        description: Salário mensal nominal em R$; zero quando ausente ou negativo na fonte.
      - name: salario_valido
        description: Verdadeiro quando salario_mensal > 0; critério para entrar em médias salariais.
      - name: horas_contratuais
        description: Horas semanais contratadas; zero quando ausentes ou negativas na fonte.
      - name: id_ingestao
        description: Lote de ingestão na camada bronze (linhagem).
      - name: numero_linha
        description: Linha do arquivo de origem no lote (linhagem).
      - name: registrado_em
        description: Momento do registro na origem transacional.

  - name: stg_municipio
    description: Municípios oficiais do IBGE, incluindo o sentinela 9999999.
    columns:
      - name: id_municipio
        description: Código IBGE de 7 dígitos.
      - name: nome_municipio
        description: Nome oficial do município.
      - name: sigla_uf
        description: Sigla da UF; NI para o sentinela.
      - name: nome_uf
        description: Nome da UF.
      - name: regiao
        description: Grande região do IBGE.
      - name: is_capital
        description: Verdadeiro para as capitais do Centro-Oeste (Brasília, Goiânia, Cuiabá e Campo Grande).
      - name: is_identificado
        description: Falso apenas para o sentinela 9999999.
      - name: is_centro_oeste
        description: Verdadeiro para municípios de DF, GO, MT e MS.

  - name: stg_cbo
    description: Ocupações da CBO 2002.
    columns:
      - name: codigo_cbo
        description: Código da ocupação com 6 dígitos.
      - name: titulo_ocupacao
        description: Título da ocupação.
      - name: codigo_grande_grupo
        description: Grande grupo ocupacional (primeiro dígito do código).
      - name: is_cadastro_oficial
        description: Falso para ocupações criadas pela carga a partir de códigos ausentes da base oficial.

  - name: stg_cnae
    description: Subclasses da CNAE 2.0 com a seção correspondente.
    columns:
      - name: codigo_cnae_subclasse
        description: Código da subclasse com 7 dígitos.
      - name: descricao_subclasse
        description: Descrição da subclasse.
      - name: codigo_secao
        description: Letra da seção CNAE; Z para atividades não identificadas.
      - name: descricao_secao
        description: Descrição da seção.
      - name: is_cadastro_oficial
        description: Falso para o sentinela 9999999 e para subclasses administrativas criadas pela carga.
