site_name: METRA (Monitoramento e Engenharia de dados do TRAbalho)
site_description: METRA (Monitoramento e Engenharia de dados do TRAbalho) | Projeto Integrado de Banco de Dados 2 (FCTE/UnB) - Squad G4
site_author: Squad G4
site_url: https://unb-bd2-2026-2-grupo-4.github.io/METRA/
repo_url: https://github.com/unb-bd2-2026-2-grupo-4/METRA
repo_name: unb-bd2-2026-2-grupo-4/METRA

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  font:
    text: Poppins

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Visão Geral:
      - Início: index.md
      - Domínio e Gestão: dominio.md
  - Engenharia de Dados:
      - Arquitetura da Plataforma: arquitetura.md
      - Camada Bronze: camada-bronze.md
      - Relacionamento entre as Bases: relacionamentos.md
      - Captura de Mudanças (CDC): cdc.md
      - Extração para Parquet e Delta: camada-parquet.md
  - Governança & Decisões:
      - Decisões de Arquitetura (ADR):
          - "ADR 0001: Origem Transacional OLTP": adr/0001-modelagem-sistema-origem.md
          - "ADR 0002: Simplificação com DuckDB": adr/0002-simplificacao-arquitetural-duckdb.md
          - "ADR 0003: Compressão Parquet": adr/0003-compressao-parquet.md
          - "ADR 0004: Estratégia de CDC": adr/0004-cdc-decodificacao-logica.md
      - Governança e IA: uso-de-ia.md
      - Diário de Bordo:
          - Semana 01: diario/semana-01.md
          - Semana 02: diario/semana-02.md
          - Semana 03: diario/semana-03.md
          - Semana 04: diario/semana-04.md
          - Semana 05: diario/semana-05.md
          - Semana 06: diario/semana-06.md
          - Semana 07: diario/semana-07.md
